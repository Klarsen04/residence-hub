# Area labels applied by .github/workflows/labeler.yml (actions/labeler v5).
# Labels are created automatically if they don't already exist.

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "vitest.config.*"
          - "src/test/**"
          - ".eslintrc.json"
          - ".prettierrc.json"
          - ".prettierignore"

"area: ai-chat":
  - changed-files:
      - any-glob-to-any-file:
          - "src/app/(app)/chat/**"
          - "src/lib/localai/**"

"area: ai-planner":
  - changed-files:
      - any-glob-to-any-file:
          - "src/app/(app)/ai-planner/**"
          - "src/app/api/ai-planner/**"
          - "src/lib/aiPlanner.ts"
          - "src/lib/aiLimits.ts"

"area: api":
  - changed-files:
      - any-glob-to-any-file:
          - "src/app/api/**"

"area: ui":
  - changed-files:
      - any-glob-to-any-file:
          - "src/components/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

"area: dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
