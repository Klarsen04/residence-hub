version: 2

updates:
  # npm dependencies — weekly, grouped to cut PR noise.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all non-major (minor + patch) bumps.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep the GitHub Actions we use up to date too.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
