version: 2

# Policy: Dependabot auto-handles MINOR/PATCH updates only (grouped, safe).
# MAJOR updates are ignored here and done deliberately via the local tooling
# (`npm run deps:check` to preview, `npm run deps:update` to apply) so breaking
# migrations aren't dripped in as failing PRs.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Hold all majors — upgrade manually when ready to migrate.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # @libsql/client is 0.x, so 0.9+ is a "minor" the major-ignore misses,
      # but it breaks the @prisma/adapter-libsql peer range. Hold until the
      # Prisma adapter is upgraded alongside it.
      - dependency-name: "@libsql/client"
        versions: [">=0.9.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
