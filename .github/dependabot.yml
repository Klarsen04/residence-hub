version: 2

updates:
  # npm dependencies — weekly, grouped to cut PR noise.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all non-major (minor + patch) bumps.
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Conventional-Commit titles (e.g. "chore(deps): bump next from 15.1 to 15.2")
    # so the "Conventional PR title" check passes without manual edits.
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # vitest 3+ removed environmentMatchGlobs (used in vitest.config.mts).
      # Hold majors until the config is migrated; minor/patch still flow.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  # Keep the GitHub Actions we use up to date too.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # compressed-size-action v3 changed its inputs/behavior. Hold the major
      # until the bundle-size workflow is updated for it.
      - dependency-name: "preactjs/compressed-size-action"
        update-types: ["version-update:semver-major"]
