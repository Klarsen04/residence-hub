name: Lighthouse

# Advisory performance/accessibility audit of public pages. Builds the app,
# starts it, and runs Lighthouse CI (see lighthouserc.js). continue-on-error
# keeps it non-blocking — CI perf varies run to run.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          NEXTAUTH_SECRET: "ci-build-only-not-a-real-secret"
          NEXTAUTH_URL: "http://localhost:3000"
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
        continue-on-error: true
        env:
          DATABASE_URL: "file:./dev.db"
          NEXTAUTH_SECRET: "ci-build-only-not-a-real-secret"
          NEXTAUTH_URL: "http://localhost:3000"
