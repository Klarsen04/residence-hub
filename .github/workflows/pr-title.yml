name: PR title

# Enforces Conventional-Commit-style PR titles (feat:, fix:, chore:, docs:, …).
# Runs on the PR head so it re-checks whenever the title is edited.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
