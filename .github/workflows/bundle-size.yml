name: Bundle size

# Comments on each PR with the gzipped JS/CSS size change vs. main. Informational
# only — it does NOT block merging (no size threshold set). strip-hash normalizes
# Next.js's hashed chunk filenames so the same chunk is compared across builds.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # needed to post/update the size comment

jobs:
  size:
    name: Compressed size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: preactjs/compressed-size-action@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          build-script: "build"
          pattern: ".next/static/**/*.{js,css}"
          strip-hash: "[.-]([a-f0-9]{8,})"
        env:
          DATABASE_URL: "file:./dev.db"
          NEXTAUTH_SECRET: "ci-build-only-not-a-real-secret"
          NEXTAUTH_URL: "http://localhost:3000"
