name: CodeQL

# GitHub's static analysis (SAST) for JS/TS. Findings appear under the repo's
# Security tab. NOTE: CodeQL is free on PUBLIC repos; on PRIVATE repos it needs
# GitHub Advanced Security. If this repo is private and you don't have GHAS,
# delete this workflow (or it will error).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1" # weekly, Monday 03:27 UTC

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
