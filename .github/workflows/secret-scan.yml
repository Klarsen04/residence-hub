name: Secret scan

# gitleaks scans the code and full git history for committed secrets (API keys,
# tokens, etc.). Works on any repo — public or private — and is free for
# personal accounts (no license needed; GITLEAKS_LICENSE is only for orgs).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so history is scanned, not just the tip
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
